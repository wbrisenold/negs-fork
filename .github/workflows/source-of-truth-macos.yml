name: Source of truth macOS build

on:
  push:
    branches:
      - studio-port-upstream-sync
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-of-truth-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  intel-package:
    name: Build, test, and package Intel Negs app
    if: github.ref_name == 'studio-port-upstream-sync'
    runs-on: macos-15-intel
    env:
      MACOS_ARCHS: x86_64
      BUILD_TARGET_DIR: target/macos-app
      CLEAN_BUILD_CACHE: "1"
      CARGO_TARGET_DIR: target/macos-app
      CARGO_TARGET_X86_64_APPLE_DARWIN_RUNNER: arch -x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          targets: x86_64-apple-darwin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record source and toolchains
        run: |
          echo "Source: $GITHUB_SHA ($GITHUB_REF_NAME)"
          test "$(uname -m)" = x86_64
          uname -m
          rustc -vV
          swift --version
      - name: Run Intel preview regression gates
        run: |
          cargo test --locked --release --target x86_64-apple-darwin -p spektrafilm-core --lib metering_preview_keeps_area_reduction_on_large_raw_frames
          cargo test --locked --release --target x86_64-apple-darwin -p spektrafilm-core --lib interactive_preview_at_editor_quality_keeps_expected_detail
          swift test --package-path macos \
            --scratch-path target/macos-app/swift-x86_64-apple-macosx14.0 \
            -c debug --triple x86_64-apple-macosx14.0 \
            --filter QuickFrameTests/testRawPreviewQualityScaleIs38PercentAndNeverUpscales
      - name: Build, package, and run the app regression gate
        run: bash scripts/package_macos_app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: negs-macos-intel-${{ github.sha }}
          path: |
            dist/releases/*.zip
            dist/releases/*.dmg
            dist/negs-macos/BUILD-INFO.txt
            dist/negs-macos/package-report.json
          if-no-files-found: error
          retention-days: 90
