name: Source of truth macOS build

on:
  push:
    branches:
      - studio-port-upstream-sync
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-of-truth-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  universal-package:
    name: Build and verify universal Negs app
    if: github.ref_name == 'studio-port-upstream-sync'
    runs-on: macos-15
    env:
      MACOS_ARCHS: arm64 x86_64
      BUILD_TARGET_DIR: target/macos-app
      CLEAN_BUILD_CACHE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record source and toolchains
        run: |
          echo "Source: $GITHUB_SHA ($GITHUB_REF_NAME)"
          uname -m
          rustc -vV
          swift --version
      - name: Build, package, and run the app regression gate
        run: bash scripts/package_macos_app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: negs-macos-universal-${{ github.sha }}
          path: |
            dist/releases/*.zip
            dist/releases/*.dmg
            dist/negs-macos/BUILD-INFO.txt
            dist/negs-macos/package-report.json
          if-no-files-found: error
          retention-days: 90
